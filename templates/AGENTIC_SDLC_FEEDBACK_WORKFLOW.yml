# Managed by Agentic SDLC starter. Safe to delete to disable scheduled feedback entirely.
name: Agentic SDLC architecture feedback

on:
  schedule:
    - cron: "41 4 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-feedback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Resolve control root and trigger
        id: resolve
        shell: bash
        run: |
          if [ -d ".agentic-sdlc" ]; then
            echo "control_root=.agentic-sdlc" >> "$GITHUB_OUTPUT"
          elif [ -f "state/STARTER_MANIFEST.json" ]; then
            echo "control_root=." >> "$GITHUB_OUTPUT"
          else
            echo "No Agentic SDLC control layer found."
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "trigger=MANUAL" >> "$GITHUB_OUTPUT"
          else
            echo "trigger=MONTHLY" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Agentic SDLC validation dependency
        if: steps.resolve.outputs.control_root != ''
        shell: bash
        run: |
          CONTROL_ROOT="${{ steps.resolve.outputs.control_root }}"
          python -m pip install --disable-pip-version-check -r "$CONTROL_ROOT/requirements-validation.txt"

      - name: Generate strict metadata-only report
        id: generate
        if: steps.resolve.outputs.control_root != ''
        shell: bash
        run: |
          CONTROL_ROOT="${{ steps.resolve.outputs.control_root }}"
          mkdir -p "$RUNNER_TEMP/agentic-feedback"
          python "$CONTROL_ROOT/tools/architecture_feedback.py"             --control-root "$CONTROL_ROOT"             --trigger "${{ steps.resolve.outputs.trigger }}"             --output "$RUNNER_TEMP/agentic-feedback/report.json"             --github-output "$GITHUB_OUTPUT"

      - name: Upload feedback artifact
        if: steps.generate.outputs.emitted == 'true' && steps.generate.outputs.artifact_enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agentic-sdlc-architecture-feedback
          path: ${{ runner.temp }}/agentic-feedback/report.json
          if-no-files-found: error
          retention-days: 30

      - name: Optional external submission with verified hash receipt
        if: >-
          steps.generate.outputs.emitted == 'true' &&
          steps.generate.outputs.external_submission_enabled == 'true' &&
          vars.AGENTIC_SDLC_FEEDBACK_SUBMIT != 'false' &&
          vars.AGENTIC_SDLC_FEEDBACK_ENDPOINT != ''
        env:
          AGENTIC_SDLC_FEEDBACK_SUBMIT: ${{ vars.AGENTIC_SDLC_FEEDBACK_SUBMIT != 'false' && 'true' || 'false' }}
          AGENTIC_SDLC_FEEDBACK_ENDPOINT: ${{ vars.AGENTIC_SDLC_FEEDBACK_ENDPOINT }}
        shell: bash
        run: |
          CONTROL_ROOT="${{ steps.resolve.outputs.control_root }}"
          python "$CONTROL_ROOT/tools/feedback_submit.py" \
            --report "$RUNNER_TEMP/agentic-feedback/report.json" \
            --config "$CONTROL_ROOT/feedback/ARCHITECTURE_FEEDBACK_CONFIG.json" \
            --schema "$CONTROL_ROOT/schemas/architecture-feedback-report.schema.json"

      - name: Privacy notice
        if: steps.generate.outputs.emitted == 'true'
        shell: bash
        run: |
          {
            echo "### Privacy"
            echo
            echo "Default monthly report: strict categories only, stored in this repository Actions. If an external endpoint is configured, outbound is ON unless you set feedback external_submission_enabled=false or repository variable AGENTIC_SDLC_FEEDBACK_SUBMIT=false. Missing collector means no outbound delivery."
            echo
            echo "Disable by setting feedback/ARCHITECTURE_FEEDBACK_CONFIG.json enabled=false, or delete this managed workflow."
          } >> "$GITHUB_STEP_SUMMARY"
