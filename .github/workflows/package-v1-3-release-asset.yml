name: Publish portable v1.3.0 download

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/package-v1-3-release-asset.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portable-v1-3-release-asset
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'MatiasAcunia/ArquitecturaRepo'
    runs-on: ubuntu-latest
    steps:
      - name: Check out immutable v1.3.0 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: v1.3.0
          fetch-depth: 1
          persist-credentials: false
      - name: Confirm exact published source and version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9c00e19b74d19c741983987b9359cb5c2ac83c55"
          test "$(tr -d '\r\n' < VERSION)" = "1.3.0"
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path("state/STARTER_MANIFEST.json").read_text())
          assert m["version"] == "1.3.0"
          assert m["status"] == "PUBLIC_STARTER_STABLE"
          PY
      - name: Verify public portable distribution
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-validation.txt
          python tools/validate_structure.py
          python tools/selftest_v13_release_contract.py
          python tools/selftest_v13_installed_lifecycle.py
      - name: Create source-pinned portable ZIP and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          artifact="ArquitecturaRepo-v1.3.0-portable.zip"
          git archive --format=zip --prefix=ArquitecturaRepo-v1.3.0/ -o "dist/$artifact" HEAD
          python - <<'PY'
          from pathlib import Path
          import zipfile
          p = Path("dist/ArquitecturaRepo-v1.3.0-portable.zip")
          with zipfile.ZipFile(p) as z:
              expected = [
                  "ArquitecturaRepo-v1.3.0/README.md",
                  "ArquitecturaRepo-v1.3.0/LICENSE",
                  "ArquitecturaRepo-v1.3.0/VERSION",
                  "ArquitecturaRepo-v1.3.0/prompts/INSTALL_THIS_SDLC.md",
                  "ArquitecturaRepo-v1.3.0/tools/scaffold_project.py",
                  "ArquitecturaRepo-v1.3.0/state/STARTER_MANIFEST.json",
              ]
              for name in expected:
                  assert name in z.namelist(), f"Missing {name}"
              assert z.testzip() is None, "Archive integrity failed"
          PY
          (cd dist && sha256sum "$artifact" > "$artifact.sha256")
      - name: Publish public ZIP as existing GitHub Release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/releases/tags/v1.3.0 --jq .tag_name)" = "v1.3.0"
          existing="$(gh release view v1.3.0 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          if echo "$existing" | grep -Fqx 'ArquitecturaRepo-v1.3.0-portable.zip'; then
            echo "Portable asset already exists; preserving published bytes."
            exit 0
          fi
          gh release upload v1.3.0 dist/ArquitecturaRepo-v1.3.0-portable.zip dist/ArquitecturaRepo-v1.3.0-portable.zip.sha256 --repo "$GITHUB_REPOSITORY"
          gh release view v1.3.0 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
