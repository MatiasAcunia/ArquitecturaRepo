name: Publish explicitly approved v1.3.0

on:
  workflow_dispatch:
    inputs:
      exact_commit_sha:
        description: "Exact accepted main commit SHA (40 hex)"
        required: true
        type: string
      authorization:
        description: "Type RELEASE_V1_3_0 only after independent A+B and CLIENT approval"
        required: true
        type: string

permissions:
  contents: write
  checks: read

jobs:
  release:
    name: Verified manual v1.3.0 release
    if: github.ref == 'refs/heads/main' && github.actor == 'MatiasAcunia'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Enforce actor, exact source, version, manifest and deliberate authorization
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.exact_commit_sha }}
          AUTHORIZE: ${{ inputs.authorization }}
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "MatiasAcunia"
          test "$AUTHORIZE" = "RELEASE_V1_3_0"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "1.3.0"
          python - <<'PYVERIFY'
          import json
          from pathlib import Path
          p=json.loads(Path('state/STARTER_MANIFEST.json').read_text())
          assert p['version']=='1.3.0' and p['status']=='PUBLIC_STARTER_STABLE'
          PYVERIFY
          git diff --quiet
          git diff --cached --quiet
          test -n "$(git ls-remote origin refs/tags/v1.2.0 | cut -f1)"
      - name: Verify exact installed portable lifecycle and legacy release gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-validation.txt
          python tools/validate_structure.py
          python tools/verify_v1_release.py
          python tools/selftest_v13_properties.py
          python tools/selftest_v13_control_plane_closeout.py
          python tools/selftest_v13_installed_lifecycle.py
      - name: Verify completed GitHub Linux and Windows checks on the same main SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ inputs.exact_commit_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/commits/$EXPECTED_SHA/check-runs?per_page=100" --jq ".check_runs | map(select(.head_sha == \"$EXPECTED_SHA\" and .conclusion == \"success\")) | map(.name)" > /tmp/checks.json
          python - <<'PYVERIFY'
          import json
          s=set(json.load(open('/tmp/checks.json')))
          assert 'validate' in s, f'Missing Ubuntu source-bound check: {s}'
          assert 'Windows portable-core smoke (not Codex Desktop acceptance)' in s, f'Missing Windows portable check: {s}'
          PYVERIFY
      - name: Publish exact immutable tag and release once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ inputs.exact_commit_sha }}
        run: |
          set -euo pipefail
          tag=v1.3.0
          prior="$(git ls-remote origin "refs/tags/$tag" | cut -f1)"
          if [ -n "$prior" ]; then
            test "$prior" = "$EXPECTED_SHA" || { echo 'Existing tag points to a different commit'; exit 1; }
            gh release view "$tag" --repo "$GH_REPO" >/dev/null
            echo "Preserving existing immutable release $tag"
            exit 0
          fi
          gh release create "$tag" --repo "$GH_REPO" --target "$EXPECTED_SHA" --title "ArquitecturaRepo v1.3.0" --notes-file docs/43_V1_3_RELEASE_NOTES_AND_UPGRADE.md --verify-tag=false

      - name: Retire superseded branches only after exact v1.3.0 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ inputs.exact_commit_sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
          test "$(git ls-remote origin refs/tags/v1.3.0 | cut -f1)" = "$EXPECTED_SHA"
          gh release view "v1.3.0" --repo "$GH_REPO" >/dev/null

          # Scope deletion to the three explicitly retired branch names.
          # Fail closed if someone created a different branch while the
          # release was being reviewed.
          mapfile -t branches < <(gh api --paginate "repos/$GH_REPO/branches?per_page=100" --jq '.[].name')
          for branch in "${branches[@]}"; do
            case "$branch" in
              main|feat/agent-continuity-bridge-offline-021|feature/project-baseline-1-1|integration/codex-daily-control-202-readonly-preflight) ;;
              *) echo "Unexpected branch $branch; branch retirement held"; exit 1 ;;
            esac
          done

          # Record exact historic branch tips as a tiny immutable release
          # artifact before retiring refs. This is evidence, not another
          # branch or a duplicate source checkout.
          tips="$RUNNER_TEMP/v1.3.0-retired-branch-refs.txt"
          printf 'Released v1.3.0 at %s\n' "$EXPECTED_SHA" > "$tips"
          for branch in "${branches[@]}"; do
            [ "$branch" = "main" ] && continue
            tip="$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq .object.sha)"
            printf '%s %s\n' "$tip" "$branch" >> "$tips"
          done
          gh release upload "v1.3.0" "$tips" --repo "$GH_REPO" --clobber

          for branch in "${branches[@]}"; do
            [ "$branch" = "main" ] && continue
            gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$branch" >/dev/null
            echo "Retired $branch"
          done

          mapfile -t remaining < <(gh api --paginate "repos/$GH_REPO/branches?per_page=100" --jq '.[].name')
          test "${#remaining[@]}" -eq 1 && test "${remaining[0]}" = "main" || {
            printf 'Branch cleanup incomplete: %s\n' "${remaining[*]}"
            exit 1
          }
          echo "Branch retirement passed: only main remains"
