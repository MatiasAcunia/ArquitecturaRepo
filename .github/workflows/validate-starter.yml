name: validate-starter

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check -r requirements-validation.txt
      - name: Falsify structure-only privacy and source-pin exemptions
        run: python tools/selftest_structure_policy.py
      - name: Validate repository structure
        run: python tools/validate_structure.py
      - name: Validate starter manifest contract
        run: python tools/validate_project.py --root state
      - name: Validate profile definitions
        run: python tools/validate_project.py --root profiles
      - name: Validate migration registry
        run: python tools/validate_project.py --root migrations
      - name: Validate minimal synthetic project
        run: python tools/validate_project.py --root examples/minimal
      - name: Validate active-campaign synthetic project
        run: python tools/validate_project.py --root examples/active_campaign
      - name: Validate terminal-candidate synthetic project
        run: python tools/validate_project.py --root examples/terminal_candidate
      - name: Falsify validator with negative fixtures
        run: python tools/selftest_validation.py
      - name: Generate and validate all scaffold profiles
        run: python tools/selftest_scaffold.py
      - name: Exercise actual first-time adopter commands, privacy and refusal paths
        run: python tools/selftest_adopter_first_steps.py
      - name: Build, read back and install exact public source ZIP on Linux
        run: python tools/selftest_v14_public_readiness.py
      - name: Execute documented Bash onboarding in a disposable project
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/primer proyecto con espacios"
          python "tools/scaffold_project.py" --target "$target" --profile "SMALL" --product-id "BASH_DEMO" --objective "A test-only app" --language "es" --no-feedback-workflow
          cd "$target"
          python ".agentic-sdlc/tools/project_status.py" --control-root ".agentic-sdlc" > /dev/null
          python ".agentic-sdlc/tools/discover_project.py" --project-root "." > /dev/null
          python ".agentic-sdlc/tools/reconstruct_context.py" --root ".agentic-sdlc" > /dev/null
      - name: Exercise schema migrations
        run: python tools/selftest_migrations.py
      - name: Exercise canonical ownership graph
        run: python tools/selftest_ownership.py
      - name: Exercise fresh-context reconstruction
        run: python tools/selftest_reconstruction.py
      - name: Physically falsify local Git source currentness
        run: python tools/selftest_git_currentness.py
      - name: Exercise stateful reference system
        run: python tools/selftest_stateful_reference.py
      - name: Exercise transfer adoption
        run: python tools/selftest_adoption.py
      - name: Exercise product discovery and project baseline
        run: python tools/selftest_project_baseline.py
      - name: Exercise privacy-preserving architecture feedback
        run: python tools/selftest_architecture_feedback.py
      - name: Exercise resumable campaign runtime
        run: python tools/selftest_runtime.py
      - name: Exercise repository efficiency and local workspace hygiene
        run: python tools/selftest_repository_hygiene.py
      - name: Exercise persistent per-file L3 inventory and safe cleanup
        run: python tools/selftest_artifact_ledger.py
      - name: Exercise hardening
        run: python tools/selftest_hardening.py
      - name: Verify complete v1 release gate
        run: python tools/verify_v1_release.py
      - name: Exercise v1.2 operational controls (synthetic, no network)
        run: python tools/selftest_operational_v12.py
      - name: Verify localized installer, FAQ and eight offline languages
        run: python tools/selftest_i18n.py
      - name: Exercise privacy-gated collector and hash-receipt rejection tests
        run: python tools/selftest_feedback_submit.py
      - name: Verify v1.2 security and exact release gates stay fail closed
        run: python tools/selftest_security_v12.py
      - name: Verify project modes, discovery and canonical theory preflight
        run: python tools/selftest_v12_setup.py
      - name: Exercise three offline process boundaries and no-replay recovery
        run: python tools/selftest_v12_longitudinal.py
      - name: Guard v1.2 privacy, language and longitudinal documentation defaults
        run: python tools/selftest_v12_documentation.py
      - name: Falsify editable release PASS and independent-host claims
        run: python tools/selftest_v12_release_falsifiers.py
      - name: Falsify malformed CLIENT theory and stale baseline
        run: python tools/selftest_v12_theory_hardening.py
      - name: Test optional offline Agent Continuity Bridge (no Codex host)
        run: python tools/selftest_agent_continuity_bridge.py
      - name: Verify release plan and private L3 terminal intake
        run: python tools/selftest_v12_stabilization.py
      - name: Reject unbound SQLite WAL currentness and stale snapshots
        run: python tools/selftest_v12_sqlite_wal.py
      - name: Verify read-only attachment of existing canonical owner references
        run: python tools/selftest_v12_attachment.py
      - name: Refuse tampered crash journals and verify bounded recovery
        run: python tools/selftest_v12_journal_security.py
      - name: Falsify partial installs and user-owned workflow collisions
        run: python tools/selftest_v12_install_staging.py
      - name: Check v1.2 candidate evidence without claiming physical host acceptance
        run: python tools/verify_v12_candidate.py
      - name: Property-test host scope and path conflict boundaries
        run: python tools/selftest_v13_properties.py
      - name: Rank I3 actions by open dependency critical path
        run: python tools/selftest_campaign_planning.py
      - name: Exercise source-bound host dispatch and recovery holds
        run: python tools/selftest_host_dispatch.py
      - name: Exercise portable ToolPort dispatch and recovery
        run: python tools/selftest_tool_port.py
      - name: Reject unbounded and vague I3 work orders
        run: python tools/selftest_work_order_guard.py
      - name: Reject stale independent review evidence and invalid campaign actors
        run: python tools/selftest_v13_control_plane_closeout.py
      - name: Independent installed portable framework lifecycle
        run: python tools/selftest_v13_installed_lifecycle.py
      - name: Verify explicit v1.3 release and upgrade boundaries
        run: python tools/selftest_v13_release_contract.py
      - name: Verify exact v1.4 publication and safety contract
        run: python tools/selftest_v14_release_contract.py
      - name: Build v1.4 public ZIP and exercise container from ZIP only
        shell: bash
        run: |
          set -euo pipefail
          public="$RUNNER_TEMP/v14-public-candidate"
          context="$RUNNER_TEMP/v14-image-context"
          python tools/package_v14_release.py --build --directory "$public"
          python tools/package_v14_release.py --verify --directory "$public"
          mkdir -p "$context"
          unzip -q "$public/ArquitecturaRepo-v1.4.0-portable.zip" -d "$context"
          source="$context/ArquitecturaRepo-v1.4.0"
          test ! -e "$source/.git"
          docker build --pull -f packaging/v1_4/Dockerfile -t arquitecturarepo-v14-prepublish:local "$source"
          docker run --rm --entrypoint sh arquitecturarepo-v14-prepublish:local -c 'test ! -e /opt/architecturarepo/.git && test ! -e /opt/architecturarepo/private'
          docker run --rm arquitecturarepo-v14-prepublish:local --help >/dev/null
          mkdir -p "$RUNNER_TEMP/v14-container-adopter"
          docker run --rm -v "$RUNNER_TEMP/v14-container-adopter:/workspace" arquitecturarepo-v14-prepublish:local --target /workspace/demo --profile SMALL --product-id "V14_CI_DEMO" --language es --no-feedback-workflow
          test -f "$RUNNER_TEMP/v14-container-adopter/demo/.agentic-sdlc/state/PRODUCT_STATE_CURRENT.json"

  windows-compatibility-smoke:
    name: Windows portable-core smoke (not Codex Desktop acceptance)
    # Avoid duplicate push/PR compute while the v1.2 candidate is reviewed.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install portable core validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-validation.txt
      - name: Test optional offline Agent Continuity Bridge (no Codex host)
        run: python tools/selftest_agent_continuity_bridge.py
      - name: Scaffold all profiles on Windows filesystem
        run: python tools/selftest_scaffold.py
      - name: Exercise first-time adopter commands and refusal paths on Windows
        run: python tools/selftest_adopter_first_steps.py
      - name: Build, read back and install exact public source ZIP on Windows
        run: python tools/selftest_v14_public_readiness.py
      - name: Execute documented PowerShell onboarding in a disposable project
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "primer proyecto con espacios"
          python "tools\scaffold_project.py" --target "$target" --profile "SMALL" --product-id "POWERSHELL_DEMO" --objective "A test-only app" --language "es" --no-feedback-workflow
          if ($LASTEXITCODE -ne 0) { throw "PowerShell scaffold failed" }
          Push-Location "$target"
          try {
            python ".agentic-sdlc\tools\project_status.py" --control-root ".agentic-sdlc" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "PowerShell project status failed" }
            python ".agentic-sdlc\tools\discover_project.py" --project-root "." | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "PowerShell project discovery failed" }
            python ".agentic-sdlc\tools\reconstruct_context.py" --root ".agentic-sdlc" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "PowerShell context reconstruction failed" }
          } finally {
            Pop-Location
          }
      - name: Physically falsify Git currentness on Windows
        run: python tools/selftest_git_currentness.py
      - name: Recover and reject tampered journals on Windows
        run: python tools/selftest_v12_journal_security.py
      - name: Validate staging, partial-install rollback and workflow preservation
        run: python tools/selftest_v12_install_staging.py
      - name: Verify local operating modes and frozen theory
        run: python tools/selftest_v12_setup.py
      - name: Property-test host scope and path conflict boundaries
        run: python tools/selftest_v13_properties.py
      - name: Rank I3 actions by open dependency critical path
        run: python tools/selftest_campaign_planning.py
      - name: Exercise source-bound host dispatch and recovery holds
        run: python tools/selftest_host_dispatch.py
      - name: Exercise portable ToolPort dispatch and recovery
        run: python tools/selftest_tool_port.py
      - name: Reject unbounded and vague I3 work orders
        run: python tools/selftest_work_order_guard.py
      - name: Reject stale independent review evidence and invalid campaign actors
        run: python tools/selftest_v13_control_plane_closeout.py
      - name: Independent installed portable framework lifecycle on Windows
        run: python tools/selftest_v13_installed_lifecycle.py
      - name: Verify v1.3 manual release and support contract on Windows
        run: python tools/selftest_v13_release_contract.py
      - name: Verify exact v1.4 publication and safety contract on Windows
        run: python tools/selftest_v14_release_contract.py
      - name: Verify cross-process plan and external-effect restart
        run: python tools/selftest_v12_longitudinal.py
      - name: Verify SQLite WAL logical currentness under Windows file locks
        run: python tools/selftest_v12_sqlite_wal.py
      - name: Verify existing governed source attachment is read-only
        run: python tools/selftest_v12_attachment.py
      - name: Test artifact lifecycle registry and file GC on Windows
        run: python tools/selftest_artifact_ledger.py
