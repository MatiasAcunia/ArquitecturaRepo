name: validate-starter

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check "jsonschema>=4.23,<5"
      - name: Validate repository structure
        run: python tools/validate_structure.py
      - name: Validate starter manifest contract
        run: python tools/validate_project.py --root state
      - name: Validate profile definitions
        run: python tools/validate_project.py --root profiles
      - name: Validate migration registry
        run: python tools/validate_project.py --root migrations
      - name: Validate minimal synthetic project
        run: python tools/validate_project.py --root examples/minimal
      - name: Validate active-campaign synthetic project
        run: python tools/validate_project.py --root examples/active_campaign
      - name: Validate terminal-candidate synthetic project
        run: python tools/validate_project.py --root examples/terminal_candidate
      - name: Falsify validator with negative fixtures
        run: python tools/selftest_validation.py
      - name: Generate and validate all scaffold profiles
        run: python tools/selftest_scaffold.py
      - name: Exercise schema migrations
        run: python tools/selftest_migrations.py
      - name: Exercise canonical ownership graph
        run: python tools/selftest_ownership.py
      - name: Exercise fresh-context reconstruction
        run: python tools/selftest_reconstruction.py
      - name: Exercise stateful reference system
        run: python tools/selftest_stateful_reference.py
      - name: Exercise transfer adoption
        run: python tools/selftest_adoption.py
      - name: Exercise product discovery and project baseline
        run: python tools/selftest_project_baseline.py
      - name: Exercise privacy-preserving architecture feedback
        run: python tools/selftest_architecture_feedback.py
      - name: Exercise resumable campaign runtime
        run: python tools/selftest_runtime.py
      - name: Exercise repository efficiency and local workspace hygiene
        run: python tools/selftest_repository_hygiene.py
      - name: Exercise hardening
        run: python tools/selftest_hardening.py
      - name: Verify complete v1 release gate
        run: python tools/verify_v1_release.py
      - name: Exercise v1.2 operational controls (synthetic, no network)
        run: python tools/selftest_operational_v12.py
      - name: Verify localized installer, FAQ and eight offline languages
        run: python tools/selftest_i18n.py
      - name: Exercise privacy-gated collector and hash-receipt rejection tests
        run: python tools/selftest_feedback_submit.py
      - name: Verify v1.2 security and exact release gates stay fail closed
        run: python tools/selftest_security_v12.py
      - name: Verify project modes, discovery and canonical theory preflight
        run: python tools/selftest_v12_setup.py
      - name: Exercise three offline process boundaries and no-replay recovery
        run: python tools/selftest_v12_longitudinal.py
      - name: Guard v1.2 privacy, language and longitudinal documentation defaults
        run: python tools/selftest_v12_documentation.py
      - name: Falsify editable release PASS and independent-host claims
        run: python tools/selftest_v12_release_falsifiers.py
      - name: Falsify malformed CLIENT theory and stale baseline
        run: python tools/selftest_v12_theory_hardening.py
      - name: Verify release plan and private L3 terminal intake
        run: python tools/selftest_v12_stabilization.py
      - name: Refuse tampered crash journals and verify bounded recovery
        run: python tools/selftest_v12_journal_security.py
      - name: Falsify partial installs and user-owned workflow collisions
        run: python tools/selftest_v12_install_staging.py
      - name: Check v1.2 candidate evidence without claiming physical host acceptance
        run: python tools/verify_v12_candidate.py

  windows-compatibility-smoke:
    name: Windows portable-core smoke (not Codex Desktop acceptance)
    # Avoid duplicate push/PR compute while the v1.2 candidate is reviewed.
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install portable core validation dependencies
        run: python -m pip install --disable-pip-version-check "jsonschema>=4.23,<5"
      - name: Scaffold all profiles on Windows filesystem
        run: python tools/selftest_scaffold.py
      - name: Recover and reject tampered journals on Windows
        run: python tools/selftest_v12_journal_security.py
      - name: Validate staging, partial-install rollback and workflow preservation
        run: python tools/selftest_v12_install_staging.py
      - name: Verify local operating modes and frozen theory
        run: python tools/selftest_v12_setup.py
      - name: Verify cross-process plan and external-effect restart
        run: python tools/selftest_v12_longitudinal.py
